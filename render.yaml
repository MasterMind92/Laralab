# Blueprint Render -- offre GRATUITE (compte/service/secrets restent a creer manuellement
# dans le dashboard Render, voir PRODUCTION.md).
#
# Contraintes de l'offre gratuite, et comment elles sont absorbees :
#   - pas de preDeployCommand ni de shell  -> migrations, comptes statiques et caches lances
#     au demarrage du conteneur (docker/60-laralab-deploiement.sh)
#   - pas de background worker             -> `schedule:work` lance dans le meme conteneur
#   - pas de disque persistant             -> fichiers uploades PERDUS a chaque redemarrage
#     (voir PRODUCTION.md, "Limites de l'offre gratuite")
#   - mise en veille apres 15 min sans trafic, ~1 min de reveil
#   - Postgres gratuit supprime 30 jours apres sa creation

databases:
  - name: laralab-db
    plan: free
    databaseName: laralab
    user: laralab

services:
  - name: laralab-web
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_NAME
        value: Laralab
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: laralab-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      # Comptes statiques de l'administration (config/comptes.php)
      - key: COMPTES_MOT_DE_PASSE
        sync: false
      - key: COMPTES_DOMAINE
        sync: false
      - key: COMPTES_ENTREPRISE
        sync: false
